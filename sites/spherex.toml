# SPHEREx colour portal (WP27; ARCHITECTURE.md sections 4.1 and 14.9).
# Legacy pages live in web/public/spherex/portal (index, colours, browse, map, sed,
# spherex_manifold, spectra/, overlays/, templates/), generated in /orange/adamginsburg/spherex by
# SPHEREx_ColorPortal.py, portal_pages.py and SPHEREx_Portal_Manifold.py. All of it is public.
#
# Deploy: the legacy flow was deploy_portal.sh (rsync of portal/ minus README.md, then an HTTP
# check). The unified portal uses `python -m portalkit build spherex`, then
# `python -m portalkit deploy spherex <BUILD_ID> [--dry-run]` and `python -m portalkit verify spherex --http`.
# The README is generated by the adapter and deployed with the pages.
#
# One shared catalog bundle (data/src) feeds all six pages. The legacy pages embedded the
# 2442-source catalog four times (colours, browse, map, plus the manifold's regex scrape of
# colours.html).
#
# Hand patch of the served index.html, recorded in adapters/spherex.py:MANIFOLD_TILE: after
# generation, someone added a "manifold" nav link and a "Grand-tour manifold" tile pointing at
# spherex_manifold.html. portal_pages.INDEX_TEMPLATE has neither. The unified landing page
# carries the tile as a card.
#
# Legacy state: browse and sed take '#<id>'. The manifold takes '#<id>' or a
# URLSearchParams hash (view=<preset id>, x/y (legacy m_/c_ keys), c=<colour>, star=<id>).
# colours.html keeps its state in the query string (colours.html:970-1014, written with
# replaceState): ax, ay (x colour = ax - ay), bx, by (y colour = bx - by), c (colour-by),
# band (CMD band), cmd=1 (CMD panel shown), yoo=1 (Yoo W51 overlay on), zoom=x0,x1,y0,y1 and
# hide=<level>|<level> (hidden levels of the colour-by category). The 'spherex-colours' grammar
# maps ax/ay/bx/by to the ccd axes (lower-cased filter keys joined with '-'), band to the cmd y
# axis, c to the colour-by column, zoom to xr/yr, yoo to the yoo_* overlay toggles and hide to a
# category filter on the c column. The colour-by choices of colours.html (s, q, cls, reg) are all
# category columns; reg (region: 355 named regions + '(none)' for the 207 sources without one) has its
# levels by source count, so hide=<region> names a level and only the largest regions get
# distinct GPU colours (the legacy page cycled its palette over every region). The manifold's legacy dim keys (m_F162M, c_F162M_F210M, ra,
# dec) reach the unified keys through page.legacy.dim_alias, which the adapter derives from the
# legacy dims (adapters/spherex.py:legacy_dim_alias); a dim_alias table on a [[portal.page]]
# entry here would override single entries.
family = "spherex"
adapter = "adapters.spherex:ADAPTER"
tier_default = "B"
legacy_paths = ["/orange/adamginsburg/spherex"]
status = "active"

[[portal]]
id = "spherex"
title = "SPHEREx colour portal"
visibility = "public"
legacy_dir = "/orange/adamginsburg/web/public/spherex/portal"
url = "https://data.rc.ufl.edu/pub/adamginsburg/spherex/portal/unified/"
inputs = [
    "/orange/adamginsburg/web/public/spherex/portal/index.html",
    "/orange/adamginsburg/web/public/spherex/portal/colours.html",
    "/orange/adamginsburg/web/public/spherex/portal/browse.html",
    "/orange/adamginsburg/web/public/spherex/portal/map.html",
    "/orange/adamginsburg/web/public/spherex/portal/sed.html",
    "/orange/adamginsburg/web/public/spherex/portal/spherex_manifold.html",
    "/orange/adamginsburg/web/public/spherex/portal/spectra",
    "/orange/adamginsburg/web/public/spherex/portal/overlays/yoo_w51.json",
    "/orange/adamginsburg/web/public/spherex/portal/templates/spherex_template_spectra.json",
    "/orange/adamginsburg/spherex/portal/README.md",
    "/orange/adamginsburg/spherex/portal/colours.html",
    "/orange/adamginsburg/spherex/rcb/rcb_target_list.ipac",
    "/orange/adamginsburg/spherex/rcb/fir_photometry.ecsv",
    "/orange/adamginsburg/spherex/rcb/herschel_phot.ecsv",
    "/orange/adamginsburg/spherex/rcb/fir_isolation.ecsv",
    "/orange/adamginsburg/spherex/rcb/alma_matches.ecsv",
    "/orange/adamginsburg/spherex/rcb/herschel_obs.ecsv",
]

[[portal.page]]
id = "index"
legacy = ["index.html"]

[[portal.page]]
id = "colours"
legacy = ["colours.html"]
grammar = ["spherex-colours"]

[[portal.page]]
id = "browse"
legacy = ["browse.html"]
grammar = ["bare-name"]

[[portal.page]]
id = "map"
legacy = ["map.html"]

[[portal.page]]
id = "sed"
legacy = ["sed.html"]
grammar = ["bare-name"]

[[portal.page]]
id = "manifold"
legacy = ["spherex_manifold.html"]
grammar = ["kv-view", "bare-name"]
