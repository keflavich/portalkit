# RGB and ACES wavelength-tour HiPS pages (WP31 extras; ARCHITECTURE.md section 14, wave 6).
# Two public, pre-rendered Aladin tour families under /orange/adamginsburg/web/public:
# avm_images/<field>_rgb_wavelength_tour.html (embedded STEPS) and
# ACES_Aladin_tour/<field>_wavelength_tour[_<variant>].html (external waypoints_*.json).
# adapters/hips_tours.py discovers both by glob, not from this list; the [[portal.page]]
# entries below exist for legacy-file bookkeeping/provenance only (section 9.3) -- a tour whose
# page id is not declared here still builds (portalkit/build.py _merge_legacy no-ops for an
# undeclared page id), so a new field dropped into either directory needs no TOML edit to work,
# only to be accounted for here.
family = "hips_tours"
adapter = "adapters.hips_tours:ADAPTER"
tier_default = "A"

[[portal]]
id = "hips_tours"
title = "Wavelength tours"
visibility = "public"
legacy_dir = "/orange/adamginsburg/web/public"
target_dir = "/orange/adamginsburg/web/public/avm_images/unified/hips_tours"
url = "https://data.rc.ufl.edu/pub/adamginsburg/avm_images/unified/hips_tours/"
inputs = [
    "/orange/adamginsburg/web/public/avm_images/*_rgb_wavelength_tour.html",
    "/orange/adamginsburg/web/public/ACES_Aladin_tour/*_wavelength_tour*.html",
    "/orange/adamginsburg/web/public/ACES_Aladin_tour/waypoints_*_wavelength*.json",
]

[[portal.page]]
id = "index"
legacy = []

