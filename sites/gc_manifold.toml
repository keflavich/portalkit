# GC catalog manifold viewers (WP30; ARCHITECTURE.md sections 4.1 and 14.2).
#
# One [[portal]] per legacy viewer: the GC Treasury manifold and the 11 per-field manifolds
# deployed under /orange/adamginsburg/jwst/releases/site/<field>_manifold and served by
# starformation.astro.ufl.edu, not by data.rc.ufl.edu (served_by = "external": the exposure
# scan reports these targets as unserved, which is allowed for an external site; deploy writes
# <legacy_dir>/unified and `verify --http` checks the starformation URL). The adapter reads each
# portal's GC manifest (schema 1) at <legacy_dir>/data/manifest.json and references the GC
# binaries in place at <url>/../data/ (no re-encode). Every legacy viewer is one index.html
# whose query state (?a=&b=&m=&p=&x1..y2&cb&cd&cm&cl&ch&g&rv&fa&sel, Treasury y) is mapped by
# the gc-query grammar.
#
# Not ported: the jwst-gc pipeline monitor (web/public/jwst-gc/monitor.html, fields/*.html,
# *_monitor5as.html; port table 14.2 archetype "excluded"). Site status is per family, so the
# monitor needs its own registry file with status = "excluded" (sites/gc_monitor.toml, not
# owned by WP30); the portals here link it from their readme.
#
# sgrb2_manifold stays registered below even though the adapter currently skips it every build
# (its deployed data tree disagrees with its manifest row count -- tree_problems()): status/
# drift reporting needs the portal entry to say so. Until the upstream tree is redeployed
# consistently, a build of this family does not produce an sgrb2_manifold portal, so any other
# built portal's `related` nav entry for it (build.py lists every sibling in `site.portals`
# without checking it was built) points at a page that does not exist; WP30 contract issue
# (build.py, not owned by WP30) -- fix by having `related` only list portals that were built.
family = "gc_manifold"
adapter = "adapters.gc_manifold:ADAPTER"
tier_default = "B"
legacy_paths = ["/orange/adamginsburg/jwst/brick/analysis"]

[[portal]]
id = "treasury_manifold"
title = "GC Treasury catalog manifold"
visibility = "public"
legacy_dir = "/orange/adamginsburg/jwst/releases/site/treasury_manifold"
target_dir = "/orange/adamginsburg/jwst/releases/site/treasury_manifold/unified"
url = "https://starformation.astro.ufl.edu/jwst-gc/treasury_manifold/unified/"
served_by = "external"
inputs = [
    "/orange/adamginsburg/jwst/releases/site/treasury_manifold/data/manifest.json",
    "/orange/adamginsburg/jwst/releases/site/treasury_manifold/data/dims/*.u16.gz",
    "/orange/adamginsburg/jwst/releases/site/treasury_manifold/data/meta/*.gz",
]

[[portal.page]]
id = "index"
legacy = ["index.html"]
grammar = ["gc-query"]

