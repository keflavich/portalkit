# Westerlund 2 JWST portal (WP24; ARCHITECTURE.md sections 4.1 and 14.11, wave 3).
# The legacy tree web/public/jwst/wd2/nirspec_2640 holds two families: the wd2 photometry pages
# generated by WD2_Portal_*.py (this file) and the NIRSpec 2640 spectra pages (family
# nirspec2640, WP25), whose landing page is the legacy index.html. The shared legacy_dir makes
# each family deploy to its own subdirectory; wd2 goes to unified/wd2/. The 2640 spectra stay in
# the nirspec2640 portal: the wd2 stars link to its specviewer by URL, and the wd2_manifold page
# plots them as a foreign record set (contract (A); adapters/wd2.py SPEC_BASE/SPEC_KEY) read from
# the page-relative base ../nirspec2640/data/ (record key 'spec', the nirspec2640 data/spec/
# index and shards), looked up by the catalogue's 'spec' column. Both portals are public. The two
# target directories must stay siblings under unified/ (unified/wd2/ and unified/nirspec2640/),
# and nirspec2640 must keep its 'spec' key (sites/nirspec2640.toml, adapters/nirspec2640.py
# FOREIGN_BASE_KEY); moving either breaks the wd2_manifold spectra.
# Legacy deep links: wd2_sedgallery read `#<star name>` (bare-name); the two manifolds wrote
# `#view=..&x=..&y=..&star=..` (kv-view). map_ccd and wd2_colorcolor read no hash; the bare-name
# grammar on them is new (port table: '#name hash honored'). The wavelength explorer had no URL
# state (the unified pane takes ?speed=).
family = "wd2"
adapter = "adapters.wd2:ADAPTER"
tier_default = "B"
legacy_paths = ["/orange/adamginsburg/jwst/brick/analysis"]

[[portal]]
id = "wd2"
title = "Westerlund 2 JWST portal"
visibility = "public"
legacy_dir = "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640"
target_dir = "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/unified/wd2"
url = "https://data.rc.ufl.edu/pub/adamginsburg/jwst/wd2/nirspec_2640/unified/wd2/"
inputs = [
    "/orange/adamginsburg/jwst/wd2/catalogs/wd2_nircam_wf_mf_nf.ecsv",
    "/orange/adamginsburg/jwst/wd2/catalogs/wd2_miri_matched.ecsv",
    "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/wd2_sed_fits.ecsv",
    "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/wd2_manifold.html",
    "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/sabbi.html",
    "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/map_ccd.html",
    "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/wd2_colorcolor.html",
    "/orange/adamginsburg/web/public/jwst/wd2/nirspec_2640/waypoints_wd2_wavelength.json",
]

# The legacy index.html is the NIRSpec 2640 landing page (WP25); wd2 has no legacy landing.
[[portal.page]]
id = "index"
legacy = []

[[portal.page]]
id = "map_ccd"
legacy = ["map_ccd.html"]
grammar = ["bare-name"]

[[portal.page]]
id = "wd2_colorcolor"
legacy = ["wd2_colorcolor.html"]
grammar = ["bare-name"]

[[portal.page]]
id = "wd2_manifold"
legacy = ["wd2_manifold.html"]
grammar = ["kv-view", "bare-name"]

[[portal.page]]
id = "sabbi"
legacy = ["sabbi.html"]
grammar = ["kv-view", "bare-name"]

[[portal.page]]
id = "wd2_sedgallery"
legacy = ["wd2_sedgallery.html"]
grammar = ["bare-name"]

# The legacy explorer read no hash or query. No grammar: the wavelength grammar consumes and
# drops ?speed=, which the wavelength pane reads from location.search.
[[portal.page]]
id = "wd2_wavelength_explorer"
legacy = ["wd2_wavelength_explorer.html"]
