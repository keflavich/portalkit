# Directory galleries (WP23; ARCHITECTURE.md sections 9 and 14.8, wave 2).
# One adapter (adapters/dirgallery_sites.py, registry GALLERIES) ports the legacy jQuery/autoindex
# gallery*.html pages: each unified gallery page covers one directory family and every legacy page
# of that family is a facet preset of it. The `preset` strings below are the `fac=<base64url JSON>`
# hashes of those facet selections (tests/adapters/test_dirgallery_sites.py checks that they equal
# the registry's).
# replace: only the brick_2221 pages may be stubbed by --replace (adapters STUB_PORTALS; port table
# "redirect stub only under --replace"). The critic's galleries and the robitaille pages stay
# untouched (port table "legacy files untouched"), and a legacy path with a symlink component
# under legacy_dir is never stubbed: those files carry replace = false and stay live.
# Each portal declares its visibility and an explicit target_dir served under that visibility.
#
# Directories considered and their owner (ported here unless named otherwise):
# /orange/adamginsburg/jwst/w51 (secure): gallery.html, jpgs/, plots/cmds/             portal w51
# web/public/jwst/w51/pngs, pngs_140, pngs_480, pngs_2100 (symlinks into jwst/w51)     portal w51_public
# web/public/t.yoo/alma_matched_seds, ccd_branches/ccds, protopop (-> /orange/.../w51)   portal w51_public
# jwst/w51/sed_fitting/plots/lowers, uppers: legacy galleries match 0 files             not ported (empty)
# /orange/adamginsburg/jwst/sgrb2: pngs, pngs_150, pngs_466, jpgs                      portal sgrb2
# jwst/sgrb2/portal/*, NB/psfs/index.html                                              sgrb2 family / not a gallery
# web/public/jwst/brick_2221/ccds_cmds (5 pages), nirspec_6927/gallery.html            portal brick_2221
# web/public/jwst/brick_2221/cloudc -> /blue/.../jwst/cloudc/images                    portal brick_2221
# web/public/jwst/brick_2221/sed_figures_f1500w_all, sed_figures_top100_f1500w         WP26 (sickle_brick)
# /orange/adamginsburg/jwst/brick: figures (9 pages), ccds_cmds (2), sed_plots, images,
#     catalog_comparison_diagnostics (+ nrca_rezoom, nrcb_rezoom), F200W/pipeline (6),
#     paper_co/fig9s + paper_co/figures (2 + 2; PNGs only, fig9s PDFs are not images)  portal brick
# jwst/brick/alma/.../*.admit/index.html                                               ADMIT product, not a gallery
# /blue/adamginsburg/adamginsburg/jwst/cloudc/F405N/pipeline                            portal cloudc
# /orange/adamginsburg/jwst/wd2: pngs, controlfield/pngs (+ empty controlfield page)   portal wd2
# web/public/jwst/wd2/nirspec_2640: wd2_sedgallery.html / pngs gallery_2640*.html      WP24 / WP25
# /orange/adamginsburg/westerlund/wd1/pngs (served as jwst/wd1)                        portal wd1
# /orange/adamginsburg/jwst/jdat_notebooks/gallery.html: /.jpg$/ matches 0 files       not ported (empty)
# /orange/adamginsburg/robitaille_models/modelgrids: imaging_run/png_b, ccds           portal robitaille_modelgrids
# modelgrids/imaging_run/png (web/public/robitaille_models/imaging)                    WP21 (robitaille)
# jwst/spectra/nirspec_6927/pngs/gallery_6927*.html                                    WP22 (nirspec6927)
# jwst/spectra/mastDownload/JWST/gallery*.html (11 archive galleries)                  WP28 (jwst_archive)
# gc-treasury/jw-jw-pms-2026/figures_v6 (different template, not in the critic list)  not ported

family = "dirgallery_sites"
adapter = "adapters.dirgallery_sites:ADAPTER"
tier_default = "B"

# ============================================================================================
# Served as web/secure/jwst/w51 (web/secure/jwst -> /orange/adamginsburg/jwst).
[[portal]]
id = "w51"
title = "W51 JWST galleries"
visibility = "secure"
legacy_dir = "/orange/adamginsburg/jwst/w51"
target_dir = "/orange/adamginsburg/jwst/w51/unified/dirgallery_sites"
url = "https://data.rc.ufl.edu/secure/adamginsburg/jwst/w51/unified/dirgallery_sites/"

[[portal.page]]
id = "index"

[[portal.page]]
id = "w51_images"
legacy = [
    { file = "gallery.html", replace = false },
]

[[portal.page]]
id = "w51_jpgs"
legacy = [
    { file = "jpgs/gallery.html", replace = false },
]

[[portal.page]]
id = "w51_cmds"
legacy = [
    { file = "plots/cmds/gallery.html", replace = false },
]

